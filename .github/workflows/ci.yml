name: CI

# Builds the firmware SITL and flies the hover checks against it: tests changes to the
# models here, and - on the schedule - catches firmware regressions between releases.

on:
  push:
    branches:
      - 'master'
  pull_request:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: 'Firmware repository'
        required: false
      firmware_ref:
        description: 'Firmware branch, tag or commit'
        required: false

permissions:
  contents: read

env:
  # The lockstep SITL is in rotorflight/rotorflight-firmware#596; switch to
  # rotorflight/rotorflight-firmware master once it is merged.
  FIRMWARE_REPO: ${{ inputs.firmware_repo || 'NightHawk32/rotorflight-firmware' }}
  FIRMWARE_REF: ${{ inputs.firmware_ref || 'feature/sitl-build' }}

jobs:

  model:

    # the model alone, without the firmware: trim, rotor and thrust laws, rate response,
    # flap/body mode, integrator, sensor model

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Model unit tests
      run: python3 -m unittest discover -s tests -v

  linux:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Check out firmware
      uses: actions/checkout@v4
      with:
        repository: ${{ env.FIRMWARE_REPO }}
        ref: ${{ env.FIRMWARE_REF }}
        path: firmware

    - name: Build SITL
      working-directory: firmware
      run: |
        make arm_sdk_install
        make TARGET=SITL
        git log -1 --format='firmware %H %s'

    - name: Hover check (angle mode)
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --check

    - name: Hover check with the governor
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --governor 2100 --check

    - name: Rescue check
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --rescue --check

    - name: Hover check in wind (5 m/s crosswind, Dryden gusts)
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --wind 5,90 --gust 1.0 --check

    - name: Hover check with servo dynamics (digital servos)
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --servos digital --check

    - name: Autorotation and landing (governor AUTOROTATION)
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --governor 2100 --autorotation land --check

    - name: Autorotation bailout (governor BAILOUT)
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --governor 2100 --autorotation bailout --check

    - name: Hover check with vibration and gyro noise (RPM filter)
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --vibration omp_m7r --gyro-chip ICM40608 --check

    - name: The vibration check fails without the RPM filter
      run: |
        # it must fail on the filtered gyro error, not on a crash or another check
        rc=0
        python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --vibration omp_m7r --gyro-chip ICM40608 --cli "feature -RPM_FILTER" --check > vib_off.log 2>&1 || rc=$?
        cat vib_off.log
        if [ "$rc" -eq 0 ] || ! grep -q '^FAIL vibration filtered: gyro error' vib_off.log \
           || grep '^FAIL' vib_off.log | grep -vq 'vibration filtered'; then
          echo "::error::the vibration check did not fail on the filtered gyro error alone with the RPM filter off"; exit 1
        fi

    - name: Replay of a real flight (OMP M7R cruise, against the real throttle and tail trim)
      run: python3 heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --replay-case heli/replays/m7r_cruise --check

  windows:

    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Check out firmware
      uses: actions/checkout@v4
      with:
        repository: ${{ env.FIRMWARE_REPO }}
        ref: ${{ env.FIRMWARE_REF }}
        path: firmware

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        update: false
        install: make curl unzip git

    - name: Build SITL
      shell: msys2 {0}
      working-directory: firmware
      run: |
        make arm_sdk_install mingw_sdk_install
        make TARGET=SITL

    - name: Hover check (angle mode)
      run: python heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --check

    - name: Hover check with the governor
      run: python heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --governor 2100 --check

    - name: Rescue check
      run: python heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --rescue --check

    - name: Hover check in wind (5 m/s crosswind, Dryden gusts)
      run: python heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --wind 5,90 --gust 1.0 --check

    - name: Hover check with servo dynamics (digital servos)
      run: python heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --servos digital --check

    - name: Autorotation and landing (governor AUTOROTATION)
      run: python heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --governor 2100 --autorotation land --check

    - name: Autorotation bailout (governor BAILOUT)
      run: python heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --governor 2100 --autorotation bailout --check

    - name: Hover check with vibration and gyro noise (RPM filter)
      run: python heli/heli_bridge.py firmware/obj/main/rotorflight_SITL.elf --seconds 34 --vibration omp_m7r --gyro-chip ICM40608 --check
